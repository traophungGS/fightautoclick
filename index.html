<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Autoclick Addiction</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 select-none">

    <!-- Centered Content Wrapper -->
    <div class="flex flex-col items-center justify-center text-center max-w-lg mx-auto space-y-8">
        
        <!-- Requested Sentence Above Button -->
        <p class="text-slate-300 text-lg md:text-xl font-light leading-relaxed">
            Slow down and enjoy the process. You're being overstimulated, and this site will fix it.
        </p>

        <!-- Main Button with Local Counter -->
        <div class="flex flex-col items-center space-y-3">
            <button 
                id="clickerBtn"
                class="px-8 py-5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-2xl rounded-2xl shadow-lg transition-all duration-150 transform active:scale-95 focus:outline-none focus:ring-4 focus:ring-indigo-500/30 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer w-64"
            >
                Clicks: <span id="counterDisplay">0</span>
            </button>
            <div id="cooldownTimer" class="h-5 text-sm text-slate-400 font-mono"></div>
        </div>

        <!-- Minimal Anti-Autoclick Warning Message -->
        <div id="warningMessage" class="h-6 text-sm text-rose-400 font-medium opacity-0 transition-opacity duration-200">
            Autoclick detected!
        </div>
    </div>

    <script>
        // DOM Elements
        const counterDisplay = document.getElementById('counterDisplay');
        const clickerBtn = document.getElementById('clickerBtn');
        const warningMessage = document.getElementById('warningMessage');
        const cooldownTimer = document.getElementById('cooldownTimer');

        // State variables
        const COOLDOWN_MS = 5000; // 5 seconds
        const PERFECT_TIMING_THRESHOLD_MS = 150; // Clicks within 150ms of cooldown end are flagged
        
        let count = parseInt(localStorage.getItem('autoclick_counter') || '0', 10);
        let cooldownEndTime = 0;
        let warningTimeout = null;
        let timerInterval = null;

        // Display initial counter
        counterDisplay.textContent = count;

        function showWarning(text) {
            warningMessage.textContent = text;
            warningMessage.classList.remove('opacity-0');
            clearTimeout(warningTimeout);
            warningTimeout = setTimeout(() => {
                warningMessage.classList.add('opacity-0');
            }, 2500);
        }

        function updateTimerUI() {
            const now = Date.now();
            const remaining = Math.max(0, cooldownEndTime - now);

            if (remaining > 0) {
                const seconds = (remaining / 1000).toFixed(1);
                cooldownTimer.textContent = `Cooldown: ${seconds}s`;
            } else {
                cooldownTimer.textContent = '';
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }
        }

        function handleClick(e) {
            e.preventDefault();
            const now = Date.now();

            // 1. Basic Synthetic Check
            if (!e.isTrusted) {
                showWarning("Autoclick detected!");
                return;
            }

            // 2. Cooldown check & Perfect-timing trap
            if (now < cooldownEndTime) {
                showWarning("Please wait for the cooldown!");
                return;
            }

            // If a previous cooldown existed, calculate how long ago it expired
            if (cooldownEndTime > 0) {
                const timeDiffAfterCooldown = now - cooldownEndTime;

                // If click landed within 150ms of cooldown expiration, it's virtually impossible for human reaction time
                if (timeDiffAfterCooldown < PERFECT_TIMING_THRESHOLD_MS) {
                    showWarning("Autoclick detected!");
                    // Reset cooldown penalty to stop repeated autoclicker attempts
                    cooldownEndTime = now + COOLDOWN_MS;
                    startTimer();
                    return;
                }
            }

            // Valid click processed
            count += 1;
            counterDisplay.textContent = count;
            localStorage.setItem('autoclick_counter', count.toString());

            // Start 5-second cooldown
            cooldownEndTime = now + COOLDOWN_MS;
            startTimer();
        }

        function startTimer() {
            updateTimerUI();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimerUI, 100);
        }

        clickerBtn.addEventListener('click', handleClick);
    </script>
</body>
</html>
